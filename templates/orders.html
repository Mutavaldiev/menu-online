
{% extends 'base.html' %}

{% block content %}

<h2>All Orders</h2>

{% for order in orders %}
    <div class="item">
        <p>Order #{{ order.id }}</p>
        <p>Customer: {{ order.customer_name }}</p>
        <p>Table: {{ order.table.number }}</p>
        <p>Status: {{ order.status }}</p>

        <a href="{% url 'order_detail' order.id %}">View Order</a>
    </div>
{% empty %}
    <p>No orders yet.</p>
{% endfor %}

{% endblock %}
